<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
  <title id="t">Two views of where language sits</title>
  <desc id="d">On the left, a hexagon where language is one of six vertices, dented because only the language score is low. On the right, a full pentagon of tech, domain, community, planning and execution, scaled outward by language as a multiplier.</desc>
  <style>
    text { font-family: D2Coding, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill: #3d3d3d; }
    .label { font-size: 14px; }
    .accent { fill: #ff4f01; font-weight: 700; }
    .caption { font-size: 16px; fill: #666; }
    .small { font-size: 13px; }
    .grid { fill: none; stroke: #dcdcdc; stroke-width: 1; }
    .axis { stroke: #e6e6e6; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff4f01"/>
    </marker>
  </defs>

  <!-- Left: language as one vertex -->
  <g>
    <polygon class="grid" points="240,100 369.9,175 369.9,325 240,400 110.1,325 110.1,175"/>
    <polygon class="grid" points="240,150 326.6,200 326.6,300 240,350 153.4,300 153.4,200"/>
    <polygon class="grid" points="240,200 283.3,225 283.3,275 240,300 196.7,275 196.7,225"/>
    <line class="axis" x1="240" y1="250" x2="240" y2="100"/>
    <line class="axis" x1="240" y1="250" x2="369.9" y2="175"/>
    <line class="axis" x1="240" y1="250" x2="369.9" y2="325"/>
    <line class="axis" x1="240" y1="250" x2="240" y2="400"/>
    <line class="axis" x1="240" y1="250" x2="110.1" y2="325"/>
    <line class="axis" x1="240" y1="250" x2="110.1" y2="175"/>

    <polygon points="240,205 350.4,186.3 350.4,313.8 240,377.5 129.6,313.8 129.6,186.3"
             fill="#6b6b6b" fill-opacity="0.18" stroke="#6b6b6b" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="240" cy="205" r="5" fill="#ff4f01"/>

    <text class="label accent" x="240" y="80" text-anchor="middle">Language</text>
    <text class="label" x="384" y="170">Tech</text>
    <text class="label" x="384" y="342">Domain</text>
    <text class="label" x="240" y="426" text-anchor="middle">Community</text>
    <text class="label" x="96" y="342" text-anchor="end">Planning</text>
    <text class="label" x="96" y="170" text-anchor="end">Execution</text>

    <text class="caption" x="240" y="476" text-anchor="middle">Where we usually place language</text>
  </g>

  <!-- Divider -->
  <line x1="490" y1="90" x2="490" y2="440" stroke="#e6e6e6" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Right: language as the multiplier -->
  <g>
    <polygon points="720,100 862.7,203.6 808.2,371.4 631.8,371.4 577.4,203.6"
             fill="#ff4f01" fill-opacity="0.07" stroke="#ff4f01" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round"/>

    <polygon points="720,155 810.3,220.6 775.8,326.9 664.2,326.9 629.7,220.6"
             fill="#6b6b6b" fill-opacity="0.18" stroke="#6b6b6b" stroke-width="2" stroke-linejoin="round"/>

    <g stroke="#ff4f01" stroke-width="2" marker-end="url(#arrow)">
      <line x1="720" y1="150" x2="720" y2="110"/>
      <line x1="815.1" y1="219.1" x2="852.9" y2="206.8"/>
      <line x1="778.8" y1="330.9" x2="802.2" y2="363.3"/>
      <line x1="661.2" y1="330.9" x2="637.8" y2="363.3"/>
      <line x1="624.9" y1="219.1" x2="587.1" y2="206.8"/>
    </g>

    <text class="label" x="720" y="80" text-anchor="middle">Tech</text>
    <text class="label" x="878" y="200">Domain</text>
    <text class="label" x="818" y="398">Community</text>
    <text class="label" x="622" y="398" text-anchor="end">Planning</text>
    <text class="label" x="562" y="200" text-anchor="end">Execution</text>

    <text class="accent" x="720" y="250" text-anchor="middle" font-size="22">× Language</text>
    <text class="small accent" x="720" y="272" text-anchor="middle" font-weight="400">(Amplifier)</text>

    <text class="caption" x="720" y="476" text-anchor="middle">What language actually does on the global stage</text>
  </g>
</svg>
