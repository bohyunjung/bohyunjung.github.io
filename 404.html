<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Redirecting to bohyunjung.com</title>
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="1; url=https://www.bohyunjung.com/">
<script>
  (function () {
    var base = "https://www.bohyunjung.com";
    var path = window.location.pathname || "/";
    var target = base + path + window.location.search + window.location.hash;
    var link = document.getElementById("target");
    if (link) { link.href = target; link.textContent = target; }
    window.location.replace(target);
  })();
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 32rem; margin: 20vh auto; padding: 0 1.5rem; line-height: 1.6; }
</style>
</head>
<body>
  <p>이 사이트는 <a href="https://www.bohyunjung.com/">www.bohyunjung.com</a> 으로 이전했습니다.</p>
  <p>이동 중: <a id="target" href="https://www.bohyunjung.com/">www.bohyunjung.com</a></p>
</body>
</html>
